<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalHero  Book Trusted Local Pros in Minutes</title>
    <meta
      name="description"
      content="LocalHero connects UK homeowners with vetted local plumbers, electricians, cleaners, painters, gardeners, carpenters, roofers and locksmiths. Fixed prices, DBS-checked pros, 45-minute emergency dispatch."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/logoWhite/logo2.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logoWhite/logo2.png" />
    <link rel="apple-touch-icon" href="/logoBlack/logo4.png" />
    <script>
      // Set theme before paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('localhero-theme');
          var isDark = stored === 'dark';
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
